<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% load static %}
    <link rel="stylesheet" href="{% static 'styles/styleglobal.css' %}" />
    <title>RolouFilmes</title>
  </head>
  <body>
    <nav>
      <img src="{% static 'midia/name_title.png' %}" alt="logo" class="logo" />
      <a href="{% url 'home' %}">Home</a>
      <a href="">Comentarios</a>
      <a href="">Filmes</a>
      {% if user.is_authenticated %} Ola, {{user.username}}
      <form action="{% url 'logout' %}" method="post" style="display: inline">
        {% csrf_token %}
        <button type="submit">Sair</button>
      </form>
      {% else %}
      <a href="{% url 'login' %}" class="botoes_login">Login</a>
      <a href="{% url 'cadastro' %}" class="botoes_login">Cadastrar</a>
      {% endif %}
    </nav>

    <main>{% block content %}{% endblock %}</main>
    <footer class="footer">
      <img src="{% static 'midia/name_title.png' %}" alt="logo" class="logo" />
      <div>
        <a>
          <img
            src="{% static 'midia/instagram.png' %}"
            alt="instagram"
            class="logo"
          />
        </a>
        <a>
          <img
            src="{% static 'midia/twitter.png' %}"
            alt="twitter"
            class="logo"
          />
        </a>
        <a>
          <img
            src="{% static 'midia/youtube.png' %}"
            alt="youtube"
            class="logo"
          />
        </a>
      </div>
      <p>Termo de Uso | Política de Privacidade | contato</p>
    </footer>
  </body>
</html>
